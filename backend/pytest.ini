[pytest]
asyncio_mode = auto
# Un solo event loop para toda la suite: los engines de SQLAlchemy viven a
# nivel de modulo y asyncpg no tolera que se reusen desde otro loop.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
filterwarnings =
    error::DeprecationWarning:app.*
